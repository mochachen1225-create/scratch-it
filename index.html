<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf3e3">
<title>抓爛它！</title>
<meta name="description" content="療癒解壓的手機網頁小遊戲：手指一滑，貓爪把紙抓爛，抓痕就是你的作品。">
<meta property="og:title" content="抓爛它！ Scratch It!">
<meta property="og:description" content="手指一滑，貓爪把紙抓爛，抓痕就是你的作品。Swipe to scratch. The mess is your masterpiece.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3a2e2a; --paper: #fdf3e3; --sheet: #fffaf2; --yellow: #ffd96a; --pink: #ffb8c6; --mint: #a9e5c6; --blue: #aed5ff; --muted: #8a7a72; --brown: #c9965a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Huninn", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; color: var(--ink);
    background: var(--paper); background-image: radial-gradient(#ead8bd 1.2px, transparent 1.4px); background-size: 22px 22px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: manipulation;
  }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .screen { display: none; min-height: 100vh; min-height: 100dvh; max-width: 480px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); flex-direction: column; align-items: center; gap: 14px; }
  .screen.active { display: flex; }
  .btn { display: block; width: 100%; max-width: 340px; font-size: 21px; font-weight: 700; padding: 14px 20px; border: 3px solid var(--ink);
    border-radius: 22px; background: var(--yellow); box-shadow: 4px 4px 0 var(--ink); cursor: pointer; text-align: center; text-decoration: none; transition: transform .08s, box-shadow .08s; }
  .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn:disabled { opacity: .45; }
  .btn-pink { background: var(--pink); } .btn-mint { background: var(--mint); } .btn-blue { background: var(--blue); } .btn-ghost { background: var(--sheet); }
  #bookBtn, #albumBtn { white-space: nowrap; font-size: 17px; }
  .row2 { display: flex; gap: 10px; width: 100%; max-width: 340px; } .row2 .btn { font-size: 18px; padding: 12px 6px; }
  .linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 15px; cursor: pointer; padding: 4px; }
  .small { font-size: 14px; color: var(--muted); margin: 0; text-align: center; }
  .label { font-size: 15px; color: var(--muted); align-self: flex-start; margin: 4px 0 -6px 4px; }
  .mute { position: fixed; z-index: 60; top: max(10px, env(safe-area-inset-top)); right: 10px; width: 44px; height: 44px; border-radius: 50%;
    font-size: 20px; border: 2.5px solid var(--ink); background: var(--sheet); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; padding: 0; }

  /* 首頁 */
  .title { margin: 14px 0 0; font-size: 58px; line-height: 1; letter-spacing: 2px; transform: rotate(-3deg); text-shadow: 4px 4px 0 var(--yellow); }
  .tagline { margin: 0; color: var(--muted); font-size: 17px; }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
  .cat { border: 3px solid var(--ink); border-radius: 18px; background: var(--sheet); box-shadow: 3px 3px 0 var(--ink); padding: 6px 4px 8px;
    display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform .1s; }
  .cat svg, .cat .catpic { width: 78px; height: 78px; object-fit: contain; }
  .cat b { font-size: 17px; } .cat small { font-size: 13px; color: var(--muted); }
  .cat.on { background: var(--yellow); transform: translateY(-3px); }
  .mats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; }
  .mat { border: 2.5px solid var(--ink); border-radius: 14px; background: var(--sheet); padding: 8px 10px; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 8px; min-height: 56px; box-shadow: 2px 2px 0 var(--ink); }
  .mat .ic { font-size: 26px; } .mat .nm { font-size: 16px; font-weight: 700; line-height: 1.15; } .mat .cd { font-size: 12px; color: var(--muted); line-height: 1.2; }
  .mat.on { background: var(--mint); }
  .mat.locked { opacity: .62; background: #efe6d8; cursor: default; }
  .bar { height: 5px; background: #e1d4c1; border-radius: 3px; margin-top: 3px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--brown); }
  .foot { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }

  /* 抓的畫面 */
  #play { padding: 0; max-width: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; display: block; }
  #paw.down { transform: translate(-50%, -12%) rotate(-8deg) scale(.92); }
  #paw { position: fixed; width: 64px; height: 98px; pointer-events: none; z-index: 10; transform: translate(-50%, -12%) rotate(-8deg); transition: transform .08s; filter: drop-shadow(2px 3px 0 rgba(0,0,0,.2)); }
  #paw2 { position: fixed; width: 58px; height: 90px; pointer-events: none; z-index: 10; transform: translate(-50%, -12%) rotate(10deg) scaleX(-1); animation: tap2 .16s infinite alternate; filter: drop-shadow(-2px 3px 0 rgba(0,0,0,.2)); }
  @keyframes tap2 { to { transform: translate(-50%, -4%) rotate(14deg) scaleX(-1) scale(.92); } }
  .hud { position: fixed; z-index: 20; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 64px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .chip { display: flex; align-items: center; gap: 4px; background: var(--sheet); border: 2.5px solid var(--ink); border-radius: 16px; padding: 2px 8px 2px 2px; font-size: 14px; box-shadow: 2px 2px 0 var(--ink); }
  .chip svg, .chip .chippic { width: 34px; height: 34px; object-fit: contain; }
  .unlockpic { width: 130px; height: 130px; object-fit: contain; }
  .unlock-ic svg { width: 130px; height: 130px; }
  .meter { flex: 1; height: 26px; border: 2.5px solid var(--ink); border-radius: 13px; background: var(--sheet); overflow: hidden; position: relative; box-shadow: 2px 2px 0 var(--ink); }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(45deg, #d9ab6f 0 6px, #c9965a 6px 12px); transition: width .2s; }
  .meter span { position: relative; display: block; text-align: center; font-size: 13px; line-height: 21px; }
  .xbtn { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--sheet); font-size: 18px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer; padding: 0; }
  #doneBtn { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); width: auto; padding: 10px 26px; font-size: 18px; }
  #doneBtn:active:not(:disabled) { transform: translateX(-50%) translate(3px, 3px); }
  #hint { position: fixed; z-index: 15; left: 0; right: 0; top: 40%; text-align: center; font-size: 22px; color: rgba(58,46,42,.75); pointer-events: none; transition: opacity .6s; text-shadow: 0 0 8px #fff; }
  .bubble { position: fixed; z-index: 25; font-size: 26px; font-weight: 700; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 4px 12px; pointer-events: none; animation: pop .9s ease-out forwards; white-space: nowrap; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 20% { transform: scale(1.15); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
  .bubble.big { font-size: 34px; background: var(--yellow); animation-duration: 1.3s; }
  .rowflash { position: fixed; left: 0; right: 0; z-index: 24; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9) 40%, rgba(255,217,106,.9) 60%, transparent);
    background-size: 200% 100%; animation: sweep .7s ease-out forwards; }
  @keyframes sweep { from { background-position: 100% 0; opacity: 1; } to { background-position: -100% 0; opacity: 0; } }
  body.zoomies .meter { animation: wiggle .18s infinite alternate; } body.zoomies .meter i { background: repeating-linear-gradient(45deg, #ff8a5c 0 6px, #ffb347 6px 12px); }
  @keyframes wiggle { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
  /* 跳舞慶祝：同一張坐姿圖，用程式彈跳、擺動、壓扁 */
  #dance { position: fixed; inset: 0; z-index: 85; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: radial-gradient(circle, rgba(255,217,106,.92), rgba(253,243,227,.94) 70%); }
  #dance p { font-size: 30px; font-weight: 700; margin: 0; text-shadow: 3px 3px 0 #fff; animation: drop .6s cubic-bezier(.3,1.6,.5,1); }
  #dance p { text-align: center; padding: 0 18px; font-size: 26px; line-height: 1.3; }
  #dance small { color: var(--muted); font-size: 14px; }
  .dancers { display: flex; align-items: flex-end; gap: 4px; height: 170px; }
  .dancer { width: 110px; transform-origin: 50% 100%; }
  .dancer svg, .dancer .dancepic { width: 110px; height: 110px; object-fit: contain; display: block; }
  .d-orange { animation: hop .46s ease-in-out infinite; }
  .d-grey { animation: sway .92s ease-in-out infinite; animation-delay: -.2s; }
  .d-white { animation: crazy .62s ease-in-out infinite; animation-delay: -.1s; }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1.08, .9); } 45% { transform: translateY(-46px) scale(.94, 1.08); } 55% { transform: translateY(-46px) scale(.94, 1.08); } }
  @keyframes sway { 0%, 100% { transform: rotate(-12deg) translateY(0); } 25% { transform: rotate(0) translateY(-20px); } 50% { transform: rotate(12deg) translateY(0); } 75% { transform: rotate(0) translateY(-20px); } }
  @keyframes crazy { 0% { transform: translateY(0) rotate(0) scale(1.1, .88); } 30% { transform: translateY(-60px) rotate(-20deg) scale(.9, 1.1); } 55% { transform: translateY(-30px) rotate(25deg); } 80% { transform: translateY(-8px) rotate(-6deg) scale(1.05, .95); } 100% { transform: translateY(0) rotate(0) scale(1.1, .88); } }
  .dancer.jump { animation: bigjump .55s ease-out !important; }
  @keyframes bigjump { 0% { transform: scale(1.15, .8); } 40% { transform: translateY(-110px) scale(.9, 1.15) rotate(-8deg); } 100% { transform: none; } }
  .dancer.still { animation: wobble 1.2s ease-in-out infinite !important; }
  @keyframes wobble { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  #dance { background-size: cover; background-position: center; }
  #dance .gift img { width: 150px; height: 150px; object-fit: contain; animation: drop .6s cubic-bezier(.3,1.6,.5,1); filter: drop-shadow(3px 4px 0 rgba(0,0,0,.15)); }
  /* 找到驚喜插畫 */
  #reveal { position: fixed; z-index: 40; left: 50%; top: max(64px, calc(env(safe-area-inset-top) + 56px)); transform: translateX(-50%); width: min(92vw, 380px);
    display: flex; gap: 10px; align-items: center; background: var(--sheet); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink); padding: 8px; pointer-events: none; }
  #reveal.go { animation: revealIn 2.8s ease-out forwards; }
  @keyframes revealIn { 0% { transform: translateX(-50%) scale(.3); opacity: 0; } 10% { transform: translateX(-50%) scale(1.08); opacity: 1; } 15% { transform: translateX(-50%) scale(1); } 88% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
  #reveal img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 2px solid var(--ink); background: #fff3d6; }
  #reveal b { display: block; font-size: 19px; line-height: 1.25; }
  #reveal small { display: inline-block; margin-top: 4px; font-size: 13px; border-radius: 8px; padding: 1px 8px; border: 1.5px solid var(--ink); }
  /* 收集冊 */
  .book { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .slot { position: relative; border: 2.5px solid var(--ink); border-radius: 12px; padding: 4px 4px 6px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; overflow: hidden; }
  .slot img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #fff3d6; display: block; }
  .slot span { font-size: 12.5px; line-height: 1.2; text-align: center; }
  .slot.unk img { filter: brightness(0) opacity(.18); }
  .slot.unk i { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font-style: normal; font-size: 34px; font-weight: 700; color: #fff; text-shadow: 2px 2px 0 var(--ink); }
  .slot.reward { width: 100%; background: linear-gradient(135deg, #ffd96a, #ffb8c6); flex-direction: row; padding: 8px; }
  .slot.reward img { width: 96px; } .slot.reward span { font-size: 16px; font-weight: 700; flex: 1; }
  .slot.reward.unk i { position: static; font-size: 28px; color: inherit; text-shadow: none; }
  .bag { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .bagitem { display: flex; align-items: center; gap: 10px; background: var(--sheet); border: 2.5px solid var(--ink); border-radius: 14px; padding: 6px 10px; box-shadow: 2px 2px 0 var(--ink); }
  .bagitem img { width: 56px; height: 56px; object-fit: contain; border-radius: 8px; }
  .bagitem span { flex: 1; font-size: 16px; } .bagitem .btn { width: auto; font-size: 16px; padding: 8px 14px; }
  /* 閃亮版：彩虹光掃過 */
  .pic { position: relative; display: block; width: 100%; overflow: hidden; border-radius: 10px; }
  #reveal .pic { width: 84px; flex: none; }
  .pic.shiny::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: linear-gradient(115deg, transparent 20%, rgba(255,120,200,.9) 35%, rgba(255,240,120,.9) 45%, rgba(120,230,255,.9) 55%, transparent 70%); background-size: 250% 100%; animation: foil 2.2s linear infinite; }
  .slot.shiny { box-shadow: 0 0 0 2px #fff, 0 0 12px 3px #ffd96a, 2px 2px 0 var(--ink); }
  @keyframes foil { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .slot em { position: absolute; top: 6px; right: 6px; font-style: normal; font-size: 12px; background: var(--ink); color: #fff; border-radius: 8px; padding: 0 5px; }
  #cv.shake { animation: shake .5s; }
  @keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-4px, 3px); } 80% { transform: translate(3px, -1px); } }
  #finish { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(253,243,227,.55); }
  #finish svg { width: 220px; height: 220px; animation: drop .6s cubic-bezier(.3,1.6,.5,1); }
  #finish p { font-size: 26px; margin: 4px 0 0; animation: purr 0.5s ease-in-out infinite alternate; }
  @keyframes drop { from { transform: translateY(-80px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes purr { from { transform: translateX(-1px); } to { transform: translateX(1px); } }

  /* 圖卡、作品集 */
  #cardImg { width: 100%; max-width: 380px; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); -webkit-touch-callout: default; }
  .album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .album img { width: 100%; border: 2.5px solid var(--ink); border-radius: 8px; cursor: pointer; display: block; }
  .overlay { position: fixed; inset: 0; z-index: 80; background: rgba(58,46,42,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay .card { background: var(--sheet); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 4px 4px 0 var(--ink); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 380px; width: 100%; text-align: center; }
  .overlay img { width: 100%; border-radius: 10px; border: 2px solid var(--ink); -webkit-touch-callout: default; }
  .unlock-ic { font-size: 64px; animation: drop .6s cubic-bezier(.3,1.6,.5,1); }
  #toast { position: fixed; z-index: 90; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 16px; font-size: 16px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<button id="muteBtn" class="mute" aria-label="sound">🔊</button>

<!-- 首頁 -->
<section id="home" class="screen active">
  <h1 class="title" data-t>抓爛它！</h1>
  <p class="tagline" data-t>手指一滑，貓爪把紙抓爛</p>
  <div class="label" data-t>選一隻貓</div>
  <div id="cats" class="cats"></div>
  <div class="label" data-t>選材質</div>
  <div id="mats" class="mats"></div>
  <button id="startBtn" class="btn" data-t>🐾 開始抓！</button>
  <div class="row2"><button id="albumBtn" class="btn btn-ghost"></button><button id="bookBtn" class="btn btn-ghost"></button></div>
  <button id="texBtn" class="linkbtn" hidden></button>
  <div class="foot"><button id="langBtn" class="linkbtn"></button>・<button id="verBtn" class="linkbtn"></button></div>
  <p id="aiNote" class="small" data-t>貓咪插畫、驚喜插畫、貓掌和背景音樂由 AI 生成（Gemini），瓦楞紙花紋之一由 AI 生成（FLUX），也有程式畫的版本</p>
  <div id="changes" class="small" hidden></div>
</section>

<!-- 抓 -->
<section id="play" class="screen">
  <canvas id="cv"></canvas>
  <div id="paw"></div>
  <div id="paw2" hidden></div>
  <div class="hud">
    <button id="quitBtn" class="xbtn" aria-label="back">✕</button>
    <div class="chip" id="catChip"></div>
    <div class="meter"><i id="meterFill"></i><span id="meterTxt"></span></div>
  </div>
  <div id="hint" data-t>用手指在紙上用力抓！</div>
  <button id="doneBtn" class="btn btn-pink" disabled data-t>抓夠了 👌</button>
  <div id="finish" hidden><div id="finishCat"></div><p data-t>呼嚕呼嚕…</p></div>
</section>

<!-- 圖卡 -->
<section id="cardScreen" class="screen">
  <img id="cardImg" alt="">
  <p id="nextUnlock" class="small" style="font-size:16px;color:var(--ink)"></p>
  <div class="row2">
    <a id="saveBtn" class="btn btn-blue" download="scratch-it.png" data-t>💾 存圖</a>
    <button id="shareBtn" class="btn btn-blue" data-t>📤 分享</button>
  </div>
  <button id="againBtn" class="btn" data-t>🔁 再抓一張</button>
  <div class="row2">
    <button id="homeBtn" class="btn btn-ghost" data-t>🐱 換貓／材質</button>
    <button id="albumBtn2" class="btn btn-ghost" data-t>🖼️ 作品集</button>
  </div>
  <button id="bookBtn2" class="btn btn-ghost"></button>
</section>

<!-- 作品集 -->
<section id="albumScreen" class="screen">
  <h2 style="margin:8px 0 0" data-t>🖼️ 作品集</h2>
  <p class="small" data-t>最近 12 張抓痕畫，只存在這支手機裡</p>
  <div id="album" class="album"></div>
  <p id="albumEmpty" class="small" data-t>還沒有作品，快去抓一張！</p>
  <button id="albumBack" class="btn btn-ghost" data-t>← 回首頁</button>
</section>

<!-- 收集冊 -->
<section id="bookScreen" class="screen">
  <h2 id="bookTitle" style="margin:8px 0 0"></h2>
  <p class="small" data-t>每張紙下面都藏著一張驚喜插畫，抓開三成就收進來</p>
  <div id="book" class="book"></div>
  <button id="rewardSlot" class="slot reward"></button>
  <div class="label" data-t>🎁 寶物袋</div>
  <div id="bag" class="bag"></div>
  <p id="bagEmpty" class="small" data-t>找到的寶物會放在這裡，可以送給貓咪</p>
  <button id="bookBack" class="btn btn-ghost" data-t>← 回首頁</button>
</section>

<div id="reveal" hidden></div>
<div id="viewer" class="overlay" hidden><div class="card"><span id="viewerPic" class="pic"><img id="viewerImg" alt=""></span><p id="viewerTxt" style="margin:0;font-size:17px;white-space:pre-line"></p><button id="viewerClose" class="btn btn-ghost" data-t>關閉</button></div></div>
<div id="unlockPop" class="overlay" hidden><div class="card"><div id="unlockIc" class="unlock-ic"></div><p id="unlockTxt" style="margin:0;font-size:20px"></p><button id="unlockOk" class="btn" data-t>太好了！</button></div></div>
<div id="dance" hidden><div class="gift"></div><div class="dancers"></div><p></p><small data-t>點一下繼續</small></div>
<div id="toast"></div>

<script src="js/i18n.js?v=0.5.2"></script>
<script src="js/i18n.en.js?v=0.5.2"></script>
<script src="js/data.js?v=0.5.2"></script>
<script src="js/cats.js?v=0.5.2"></script>
<script src="js/fx.js?v=0.5.2"></script>
<script src="js/game.js?v=0.5.2"></script>
</body>
</html>
